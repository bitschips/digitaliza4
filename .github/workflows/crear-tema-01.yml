name: Crear presentación del Tema 1
on:
  push:
    paths:
      - '.github/workflows/crear-tema-01.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  presentacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-pptx
      - run: python temas/tema-01-arquitectura-de-ordenadores/presentaciones/generar_pptx.py
      - name: Publicar presentación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temas/tema-01-arquitectura-de-ordenadores/presentaciones/tema-01-arquitectura-de-ordenadores.pptx
          git commit -m "Publicar presentación PPTX Tema 1" || exit 0
          git push
