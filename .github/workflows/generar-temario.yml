name: Generar PDF y PowerPoint del temario
on:
  workflow_dispatch:
  push:
    paths:
      - 'Temario_Digitalizacion_4ESO.md'
      - 'scripts/generar_temario.py'
      - '.github/workflows/generar-temario.yml'
permissions:
  contents: write
jobs:
  documentos:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install reportlab python-pptx
      - name: Generar PDF y PPTX
        run: python scripts/generar_temario.py
      - name: Publicar documentos en main
        run: |
          if git diff --quiet -- Temario_Digitalizacion_4ESO.pdf Temario_Digitalizacion_4ESO.pptx && git ls-files --error-unmatch Temario_Digitalizacion_4ESO.pdf Temario_Digitalizacion_4ESO.pptx >/dev/null 2>&1; then
            echo "No hay cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Temario_Digitalizacion_4ESO.pdf Temario_Digitalizacion_4ESO.pptx
          git commit -m "Generar PDF y PowerPoint del temario"
          git push
