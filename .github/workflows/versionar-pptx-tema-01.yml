name: Incorporar version al PPTX del Tema 1
on:
  push:
    paths:
      - '.github/workflows/versionar-pptx-tema-01.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  versionar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar biblioteca
        run: python -m pip install python-pptx
      - name: Añadir version y fecha a la presentacion
        run: |
          python - <<'PY'
          from pathlib import Path
          from pptx import Presentation
          from pptx.util import Inches, Pt
          from pptx.dml.color import RGBColor
          path = Path('temas/tema-01-arquitectura-de-ordenadores/presentaciones/tema-01-arquitectura-de-ordenadores.pptx')
          prs = Presentation(path)
          props = prs.core_properties
          props.subject = 'Digitalización 4.º ESO - Tema 1 - versión 1.0.0'
          props.keywords = 'tema-01, version 1.0.0, 2026-11-19'
          props.comments = 'Versión de contenido 1.0.0, actualizada el 19/11/2026.'
          for i, slide in enumerate(prs.slides):
              if any('v1.0.0' in shape.text for shape in slide.shapes if shape.has_text_frame):
                  continue
              shape = slide.shapes.add_textbox(Inches(9.5), Inches(7.18), Inches(2.1), Inches(0.24))
              p = shape.text_frame.paragraphs[0]
              p.text = 'v1.0.0  ·  19/11/2026'
              p.font.name = 'Aptos'
              p.font.size = Pt(9)
              p.font.color.rgb = RGBColor(68, 112, 133)
          prs.save(path)
          print('Version escrita en',len(prs.slides),'diapositivas')
          PY
      - name: Publicar presentacion actualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temas/tema-01-arquitectura-de-ordenadores/presentaciones/tema-01-arquitectura-de-ordenadores.pptx
          git diff --cached --quiet && exit 0
          git commit -m "Anotar version 1.0.0 y fecha en PPTX del Tema 1"
          git push
