<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Capacidad, frecuencia y potencia de cálculo</title><desc id="desc">Tres tarjetas: capacidad en GB y TB con un SSD; frecuencia en GHz con un chip y ondas de reloj; potencia de cálculo en TFLOPS con una GPU y operaciones matemáticas.</desc><rect width="1200" height="620" fill="#f1f5f9"/><text x="600" y="65" font-family="Arial,sans-serif" font-size="36" font-weight="700" text-anchor="middle" fill="#0f172a">¿Qué mide cada unidad?</text>
<g font-family="Arial,sans-serif">
<rect x="42" y="112" width="355" height="440" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/><rect x="55" y="127" width="329" height="62" rx="13" fill="#dbeafe"/><text x="220" y="168" font-size="29" font-weight="700" text-anchor="middle" fill="#1d4ed8">CAPACIDAD</text><rect x="126" y="221" width="188" height="116" rx="18" fill="#334155"/><rect x="145" y="242" width="150" height="73" rx="9" fill="#64748b"/><circle cx="158" cy="255" r="5" fill="#93c5fd"/><circle cx="282" cy="303" r="5" fill="#93c5fd"/><text x="220" y="289" font-size="32" font-weight="700" text-anchor="middle" fill="white">SSD</text><text x="220" y="393" font-size="40" font-weight="700" text-anchor="middle" fill="#1d4ed8">GB · TB</text><text x="220" y="438" font-size="22" text-anchor="middle" fill="#334155">¿Cuántos datos caben?</text><text x="220" y="475" font-size="20" text-anchor="middle" fill="#64748b">Ejemplo: SSD de 1 TB</text>
<rect x="422" y="112" width="355" height="440" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/><rect x="435" y="127" width="329" height="62" rx="13" fill="#dcfce7"/><text x="600" y="168" font-size="29" font-weight="700" text-anchor="middle" fill="#166534">FRECUENCIA</text><rect x="522" y="222" width="156" height="114" rx="14" fill="#166534"/><rect x="545" y="244" width="110" height="72" rx="7" fill="#86efac"/><text x="600" y="290" font-size="30" font-weight="700" text-anchor="middle" fill="#14532d">CPU</text><path d="M470 351 h35 v-16 h36 v16 h36 v-16 h36 v16 h36 v-16 h35" fill="none" stroke="#16a34a" stroke-width="6" stroke-linejoin="round"/><text x="600" y="393" font-size="40" font-weight="700" text-anchor="middle" fill="#15803d">GHz</text><text x="600" y="438" font-size="21" text-anchor="middle" fill="#334155">¿Cuántos ciclos por segundo?</text><text x="600" y="475" font-size="20" text-anchor="middle" fill="#64748b">Ejemplo: CPU a 3,5 GHz</text>
<rect x="802" y="112" width="355" height="440" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/><rect x="815" y="127" width="329" height="62" rx="13" fill="#f3e8ff"/><text x="980" y="168" font-size="26" font-weight="700" text-anchor="middle" fill="#7e22ce">CÁLCULO</text><rect x="885" y="225" width="190" height="112" rx="14" fill="#581c87"/><circle cx="932" cy="281" r="30" fill="#c4b5fd"/><circle cx="932" cy="281" r="16" fill="#581c87"/><circle cx="1024" cy="281" r="30" fill="#c4b5fd"/><circle cx="1024" cy="281" r="16" fill="#581c87"/><text x="980" y="393" font-size="40" font-weight="700" text-anchor="middle" fill="#7e22ce">TFLOPS</text><text x="980" y="438" font-size="21" text-anchor="middle" fill="#334155">¿Cuántas operaciones por segundo?</text><text x="980" y="475" font-size="20" text-anchor="middle" fill="#64748b">Ejemplo: potencia teórica GPU</text>
</g><text x="600" y="589" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#475569">Más GHz o TFLOPS no garantiza por sí solo mejor rendimiento real.</text></svg>