<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="Esquema de carga y descarga de una pila recargable con una carga eléctrica y un voltímetro en paralelo">
<rect width="900" height="430" rx="20" fill="#f8fafc"/><text x="35" y="44" font-family="Arial" font-size="26" font-weight="bold" fill="#123052">Medimos la descarga de una batería</text>
<rect x="34" y="70" width="546" height="316" rx="15" fill="white" stroke="#ccd7e4" stroke-width="2"/>
<g stroke="#334155" stroke-width="5" fill="none"><path d="M115 150 H280 V120 H455 V160"/><path d="M455 238 V321 H115 V270"/><path d="M280 120 V190"/><path d="M280 260 V321"/></g>
<rect x="75" y="150" width="80" height="120" rx="14" fill="#d6f4dd" stroke="#168044" stroke-width="3"/><rect x="95" y="139" width="40" height="12" rx="4" fill="#168044"/>
<text x="115" y="206" text-anchor="middle" font-size="20" font-family="Arial" fill="#114b2d">Pila</text><text x="115" y="230" text-anchor="middle" font-size="18" font-family="Arial" fill="#114b2d">1,40 V</text>
<circle cx="455" cy="199" r="39" fill="#fff4ca" stroke="#b7791f" stroke-width="4"/><path d="M441 190 Q455 173 469 190 L460 214 H450 Z" stroke="#b7791f" stroke-width="3" fill="none"/><text x="455" y="268" text-anchor="middle" font-size="18" font-family="Arial" fill="#334155">Carga eléctrica</text>
<rect x="221" y="190" width="118" height="70" rx="12" fill="#dceeff" stroke="#2466a1" stroke-width="3"/><text x="280" y="220" text-anchor="middle" font-size="18" font-family="Arial" fill="#14476c">Voltímetro</text><text x="280" y="243" text-anchor="middle" font-size="17" font-family="Arial" fill="#14476c">1,40 V</text>
<text x="306" y="366" text-anchor="middle" font-size="17" font-family="Arial" fill="#475569">El voltímetro mide la tensión en paralelo con la pila.</text>
<rect x="607" y="70" width="260" height="146" rx="15" fill="#e6f2ff"/><text x="630" y="102" font-size="23" font-family="Arial" font-weight="bold" fill="#164872">1. Carga previa</text><text x="630" y="135" font-size="17" font-family="Arial" fill="#183653">Cargar la pila con su</text><text x="630" y="158" font-size="17" font-family="Arial" fill="#183653">cargador compatible.</text><text x="630" y="187" font-size="16" font-family="Arial" fill="#456277">No cargar con este circuito.</text>
<rect x="607" y="236" width="260" height="150" rx="15" fill="#e6f9ed"/><text x="630" y="269" font-size="23" font-family="Arial" font-weight="bold" fill="#14643c">2. Descarga</text><text x="630" y="300" font-size="17" font-family="Arial" fill="#184d30">Conectamos la carga</text><text x="630" y="324" font-size="17" font-family="Arial" fill="#184d30">y anotamos horas y</text><text x="630" y="348" font-size="17" font-family="Arial" fill="#184d30">tensión de la pila.</text>
</svg>