<g font-family="Arial" fill="#273d54"><text x="505" y="86" font-size="22" font-weight="bold">Z = X² + Y²</text><text x="505" y="122" font-size="16">Superficie: cuenco</text><text x="505" y="157" font-size="20" font-weight="bold" fill="#b5791a">Plano Z = 9</text><text x="505" y="185" font-size="16">Intersección:</text><text x="505" y="210" font-size="18">X² + Y² = 9</text><text x="505" y="254" font-size="16">Vista desde arriba:</text><text x="505" y="279" font-size="16">circunferencia</text><text x="505" y="328" font-size="13">Esquema conceptual</text></g></svg>