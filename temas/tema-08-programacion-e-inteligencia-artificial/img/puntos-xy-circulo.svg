<g font-family="Arial" fill="#22364a"><text x="510" y="116" font-size="19" font-weight="bold">¿Qué aprende la red?</text><text x="510" y="153" font-size="16">Azul: dentro</text><text x="510" y="181" font-size="16">Rojo: fuera</text><text x="510" y="231" font-size="16">X e Y son</text><text x="510" y="255" font-size="16">coordenadas.</text><text x="510" y="317" font-size="16">Circunferencia:</text><text x="510" y="346" font-size="19" font-weight="bold">X² + Y² = 9</text><text x="510" y="396" font-size="14">Dibujo didáctico</text></g></svg>